version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: bmf_root_password
      MYSQL_DATABASE: bmf_community
      MYSQL_USER: bmf_user
      MYSQL_PASSWORD: bmf_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: 4000
      DATABASE_URL: "mysql://bmf_user:bmf_password@db:3306/bmf_community"
      JWT_SECRET: "bmf_super_secure_production_jwt_key_2026"
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
